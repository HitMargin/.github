name: Generate Metrics & Contributor Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:                      # 图表文件更新不触发本 workflow，切断自触发链
      - 'metrics-left.svg'
      - 'metrics-right.svg'
      - 'HitMargin.svg'
      - 'HitMargin.html'
      - 'hitmargin.svg'                # 兜底：防止工具输出小写文件名导致自触发
      - 'hitmargin.html'

permissions:
  contents: write

# ★ 全局串行，同一时间只允许一个 run 操作 main
concurrency:
  group: metrics-main
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 左栏:基础信息 + 组织简介
      - name: Generate Metrics (left)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HitMargin
          template: classic
          filename: metrics-left.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: header, repositories, metadata
          plugin_introduction: yes
          plugin_traffic: yes

      # 右栏:语言占比 + 代码行数 + issue/PR 状态
      - name: Generate Metrics (right)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HitMargin
          template: classic
          filename: metrics-right.svg
          output_action: none
          config_timezone: Asia/Shanghai
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 0%
          plugin_followup: yes

      # 用 SSH 签名提交:署名归本人 + 绿色 Verified 徽章
      - name: Commit and push (SSH signed)
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.METRICS_SIGNING_KEY_B64 }}" | base64 -d > "$HOME/.ssh/signing_key"
          chmod 600 "$HOME/.ssh/signing_key"

          git config user.name "HitMargin"
          git config user.email "2228293026@qq.com"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/signing_key"
          git config commit.gpgsign true
          git config pull.rebase true

          # docker 以 root 写入,需要 sudo 取回
          shopt -s nullglob
          for f in /metrics_renders/*.svg; do
            sudo cp -f "$f" .
            sudo chown "$(id -u):$(id -g)" "$(basename "$f")"
          done

          git add --all
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update metrics [skip ci]"

          # 推送前先同步,避免并发导致的 non-fast-forward
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($attempt)..."
            git pull --rebase --autostash
          done
          echo "::error::Failed to push after 3 attempts"
          exit 1

  contributor-graph:
    needs: metrics                    # ★ 等 metrics 全部 push 完再开始
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # rebase 需要完整历史

      - name: Sync with remote and generate SVG
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e GITHUB_TOKEN=${{ secrets.METRICS_TOKEN }} \
            ghcr.io/ewels/contributor-graphs HitMargin --sort commits 2>&1 | tee output.log

      - name: List files
        run: |
          ls -la
          find . -maxdepth 1 \( -name "*.svg" -o -name "*.html" \) -type f

      # ★ 同样用 SSH 签名提交，保持全仓库提交身份一致
      - name: Commit and push (SSH signed, with retry)
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          printf '%s' "${{ secrets.METRICS_SIGNING_KEY_B64 }}" | base64 -d > "$HOME/.ssh/signing_key"
          chmod 600 "$HOME/.ssh/signing_key"

          git config user.name "HitMargin"
          git config user.email "2228293026@qq.com"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/signing_key"
          git config commit.gpgsign true
          git config pull.rebase true

          # 清理 Docker 运行日志，避免被误提交
          rm -f output.log

          # 精确添加 contributor graph 产物（排除 metrics-*）
          shopt -s nullglob
          added=0
          for f in *.svg *.html; do
            case "$f" in
              metrics-left.svg|metrics-right.svg) continue ;;
            esac
            git add "$f"
            added=1
          done

          if [ "$added" -eq 0 ]; then
            echo "::error::No contributor graph output found, aborting"
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "📊 update contributor graph [skip ci]"

          # ★ 重试兜底：即使有未知并发，也能最终 push 成功
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push rejected, retry $i/5..."
            git pull --rebase origin main || git rebase --abort
            sleep $((i * 3))
          done

          echo "::error::Push failed after retries"
          exit 1
